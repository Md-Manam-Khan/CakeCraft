<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wlcm">
        <h1>Welcome to BakeCraft</h1>
        <p>Design your dream cake, place your order, and track it — all in one place.</p>
    </div>
    <div class="form">
        <h2>Tell Us About You</h2>
        <form>
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name">
            <label for="contact">Contact Number</label>
            <input type="tel" id="contact" name="contact" placeholder="Enter your phone number">
            <label for="address">Delivery Address</label>
            <textarea id="address" name="address" placeholder="Enter your full address"></textarea>
            <button>Submit</button>
        </form>
    </div>
</body>
</html>
